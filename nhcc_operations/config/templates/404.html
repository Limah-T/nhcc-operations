<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | NHCC Operations</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:Inter,sans-serif;
            background:#f8fafc;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0;
            color:#0f172a;
        }

        .error-card{
            max-width:560px;
            width:100%;
            background:#fff;
            border-radius:24px;
            padding:3rem;
            text-align:center;
            box-shadow:0 15px 40px rgba(15,23,42,.08);
        }

        .error-icon{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#dbeafe;
            color:#2563eb;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:2.5rem;
            margin:0 auto 1.5rem;
        }

        h1{
            font-size:5rem;
            font-weight:800;
            color:#2563eb;
            margin-bottom:.5rem;
        }

        h3{
            font-weight:700;
            margin-bottom:1rem;
        }

        p{
            color:#64748b;
            margin-bottom:2rem;
        }

        .btn-primary{
            border-radius:999px;
            padding:.8rem 2rem;
            font-weight:600;
        }
    </style>
</head>
<body>

<div class="error-card">

    <div class="error-icon">
        <i class="bi bi-exclamation-triangle"></i>
    </div>

    <h1>404</h1>

    <h3>Page Not Found</h3>

    <p>
        Sorry, the page you are looking for doesn't exist,
        has been moved, or the address is incorrect.
    </p>

    <a href="{% url 'dashboard'%}" class="btn btn-primary">
        <i class="bi bi-house-door me-2"></i>
        Go to Home
    </a>

</div>

</body>
</html>
