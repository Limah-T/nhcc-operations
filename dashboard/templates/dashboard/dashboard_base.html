{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}NHCC Operations{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --sidebar:#0f172a;
            --sidebar-hover:#1e293b;
            --primary:#2563eb;
            --bg:#f5f7fb;
            --border:#e5e7eb;
            --text:#0f172a;
            --muted:#64748b;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            height:100%;
        }

        body{
            font-family:Inter,sans-serif;
            background:var(--bg);
            color:var(--text);
            overflow-x:hidden;
        }

        a{
            text-decoration:none;
        }

        .wrapper{
            min-height:100vh;
        }

        /*
        ======================
        Sidebar
        ======================
        */

        .sidebar{
            position:fixed;
            top:0;
            left:0;
            bottom:0;

            width:270px;

            background:var(--sidebar);
            color:#fff;

            display:flex;
            flex-direction:column;

            padding:24px;

            overflow-y:auto;
            z-index:1040;
        }

        /*
        ======================
        Main
        ======================
        */

        .main{
            margin-left:270px;
            height:100vh;

            display:flex;
            flex-direction:column;

            overflow:hidden;
        }

        /*
        ======================
        Topbar
        ======================
        */

        .topbar{
            height:72px;

            background:#fff;

            border-bottom:1px solid var(--border);

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 32px;

            flex-shrink:0;

            position:sticky;
            top:0;
            z-index:1000;
        }

        .topbar-title h5{
            margin-bottom:2px;
            font-weight:700;
        }

        .topbar-title small{
            color:var(--muted);
        }

        .topbar-right{
            display:flex;
            align-items:center;
            gap:18px;
        }

        .avatar{
            width:42px;
            height:42px;

            border-radius:50%;

            background:var(--primary);
            color:#fff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-weight:700;
        }

        /*
        ======================
        Content
        ======================
        */

        .content{
            flex:1;
            padding:32px;

            overflow-y:auto;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 8px 24px rgba(15,23,42,.06);
        }
        .btn.rounded-circle{
            width:42px;
            height:42px;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:0;
        }

        /* ===========================
        Search
        =========================== */

        .search-box{
            position:relative;
            width:100%;
            max-width:560px;
        }

        .search-box .form-control{

            height:50px;

            padding-left:48px;
            padding-right:18px;

            border:1px solid #e5e7eb;

            border-radius:999px;

            background:#f8fafc;

            font-size:.95rem;

            box-shadow:none;

            transition:all .25s ease;
        }

        .search-box .form-control::placeholder{
            color:#94a3b8;
        }

        .search-box .form-control:focus{

            background:#fff;

            border-color:#2563eb;

            box-shadow:0 0 0 4px rgba(37,99,235,.12);

            outline:none;
        }

        .search-icon{

            position:absolute;

            left:18px;

            top:50%;

            transform:translateY(-50%);

            color:#94a3b8;

            font-size:1rem;

            z-index:5;

            pointer-events:none;
        }

        /*
        ======================
        Mobile
        ======================
        */

       @media (max-width:991px){

            .sidebar{
                position:fixed;
                top:0;
                left:-270px;
                width:270px;
                height:100vh;
                transition:left .3s ease;
                z-index:1050;
            }

            .sidebar.show{
                left:0;
            }

            .main{
                margin-left:0;
            }
           
            .topbar{
                height:64px;
                padding:0 18px;
                flex-wrap:nowrap;
            }

            /*
            ======================
            Content
            ======================
            */

            .content{
                flex:1;
                padding:18px;
                overflow-y:auto;
            }
            .input-group {
                max-width: 100% !important;
            }
            .navbar{
                    padding:.8rem 1rem !important;
                }

                .search-box{
                    min-width:0;
                }

                .search-box input{
                    font-size:.9rem;
                }

                .dropdown .btn{
                    padding:0;
                    border:none;
                    background:transparent;
                }

            }

    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="wrapper">

    {% include "dashboard/partials/sidebar.html" %}

    <main class="main">

        {% include "dashboard/partials/topbar.html" %}

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

    </main>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.getElementById("sidebar");
    const menuButton = document.getElementById("menuButton");
    const closeButton = document.getElementById("closeSidebar");

    if(menuButton){
        menuButton.addEventListener("click", function(){
            sidebar.classList.add("show");
        });
    }

    if(closeButton){
        closeButton.addEventListener("click", function(){
            sidebar.classList.remove("show");
        });
    }

});
</script>
{% block extra_js %}{% endblock %}

</body>
</html>
