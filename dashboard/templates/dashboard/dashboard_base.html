{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}NHCC Operations{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --sidebar:#0f172a;
            --sidebar-hover:#1e293b;
            --primary:#2563eb;
            --bg:#f5f7fb;
            --border:#e5e7eb;
            --text:#0f172a;
            --muted:#64748b;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            min-height:100%;
        }

        body{
            min-height:100vh;
        }

        body{
            font-family:Inter,sans-serif;
            background:var(--bg);
            color:var(--text);
            overflow-x:hidden;
        }

        a{
            text-decoration:none;
        }

        .wrapper{
            min-height:100vh;
        }

        /*
        ======================
        Sidebar
        ======================
        */

        .sidebar{
            position:fixed;
            top:0;
            left:0;
            bottom:0;

            width:270px;

            background:var(--sidebar);
            color:#fff;

            display:flex;
            flex-direction:column;

            padding:24px;

            z-index:1040;
        }

        /*
        ======================
        Main
        ======================
        */


        .main{
            margin-left:270px;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            min-width:0;
        }
        /*
        ======================
        Topbar
        ======================
        */

        .topbar{
            height:72px;

            background:#fff;

            border-bottom:1px solid var(--border);

            display:flex;
            align-items:center;
            justify-content:space-between;

            padding:0 32px;

            flex-shrink:0;

            position:sticky;
            top:0;
            z-index:1000;
        }

        .topbar-title h5{
            margin-bottom:2px;
            font-weight:700;
        }

        .topbar-title small{
            color:var(--muted);
        }

        .topbar-right{
            display:flex;
            align-items:center;
            gap:18px;
        }

        .avatar{
            width:42px;
            height:42px;

            border-radius:50%;

            background:var(--primary);
            color:#fff;

            display:flex;
            align-items:center;
            justify-content:center;

            font-weight:700;
        }

        /*
        ======================
        Content
        ======================
        */

        .content{
            flex:1 1 auto;
            min-height:0;
            padding:18px;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 8px 24px rgba(15,23,42,.06);
        }
        .btn.rounded-circle{
            width:42px;
            height:42px;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:0;
        }

        /*
        ======================
        Mobile
        ======================
        */

        @media (max-width:991px){

            .sidebar{
                position:fixed;
                top:0;
                left:-270px;
                width:270px;
                height:100vh;
                transition:left .3s ease;
                z-index:1050;
            }

            .sidebar.show{
                left:0;
            }

            .main{
                margin-left:0;
            }

            .topbar{
                height:64px;
                padding:0 18px;
                flex-wrap:nowrap;
            }

           .content{
                padding:18px;
            }

            

            .input-group{
                max-width:100%!important;
            }

            .navbar{
                padding:.8rem 1rem!important;
            }

            .search-box{
                flex: 1;
                min-width: 0;
                max-width: none;
            }

            .search-box .form-control{
                font-size: .9rem;
            }

            .dropdown .btn{
                padding:.7rem 1rem;
                border:none;
                background:var(--primary);
                color:#fff;
                border-radius:999px;
                box-shadow:0 8px 24px rgba(37,99,235,.2);
            }

            .dropdown .btn:hover,
            .dropdown .btn:focus,
            .dropdown .btn.show{
                background:#1d4ed8;
                color:#fff;
            }
        }

        .modal-dialog-scrollable .modal-content{
            max-height:calc(100vh - 1rem);
            }

            .modal-dialog-scrollable .modal-body{
                overflow-y:auto;
            }

        .search-box{
            position: relative;
            flex: 1;
            min-width: 0;
            max-width: 500px;
        }

        .search-box .form-control{
            padding-left: 2.5rem;
            border-radius: 999px;
        }

        .search-icon{
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .expense-card {
        transition: transform .2s ease, box-shadow .2s ease;
        }

        .expense-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.12) !important;
        }

        #addMultipleExpenseModal .modal-content{
        max-height:90vh;
    }

    #addMultipleExpenseModal .modal-body{
        overflow-y:auto;
        max-height:calc(90vh - 140px);
    }

    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="wrapper">

    {% include "dashboard/partials/sidebar.html" %}

    <main class="main">

        {% include "dashboard/partials/topbar.html" %}

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>

    </main>


</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const sidebar = document.getElementById("sidebar");
    const menuButton = document.getElementById("menuButton");
    const closeButton = document.getElementById("closeSidebar");

    if (menuButton) {
        menuButton.addEventListener("click", function () {
            sidebar.classList.add("show");
        });
    }

    if (closeButton) {
        closeButton.addEventListener("click", function () {
            sidebar.classList.remove("show");
        });
    }

});
</script>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
