{% extends "account/auth_base.html" %}

{% block title %}Set password · NHCC Operations{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-xl-5">
        <div class="auth-card shadow-sm p-4 p-lg-5">
            <div class="text-center mb-4">
                <span class="hero-badge badge rounded-pill px-3 py-2 mb-3">
                    <i class="bi bi-key me-2"></i>Account recovery
                </span>
                <h1 class="h3 fw-bold mb-2">Reset your password</h1>
                <p class="text-muted mb-0">Enter and confirm new password.</p>
            </div>

            <form method="post" class="needs-validation" novalidate>
                {% csrf_token %}
                {% for error in form.new_password.errors %}
                        <div class="text-danger small mt-1">
                            {{ error }}
                        </div>
                    {% endfor %}

                <div class="mb-4">
                     <label class="form-label fw-semibold">Work email</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="name@nhcc.org"
                            value="{{ form.email.value|default:'' }}"
                            
                        >
                    </div>
                    <label for="newPassword" class="form-label fw-semibold">New Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="newPassword" name="new_password" 
                        required>
                    </div>
                     <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmPassword" name="confirm_password" 
                        required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">Reset password</button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
