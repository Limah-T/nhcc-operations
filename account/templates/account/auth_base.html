{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NHCC Operations{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand: #111827;
            --accent: #2563eb;
            --accent-soft: #eff6ff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fbff 0%, #f3f6ff 55%, #f9fafb 100%);
            color: var(--text);
        }

        .auth-shell {
            min-height: 100vh;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
            border-radius: 28px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .auth-side {
            background: linear-gradient(145deg, #0f172a 0%, #111827 45%, #1e293b 100%);
            color: white;
        }

        .hero-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            border-color: var(--border);
            padding: 0.82rem 1rem;
            transition: all 0.2s ease;
            background-color: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #93c5fd;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }

        .btn-primary {
            border-radius: 14px;
            padding: 0.85rem 1rem;
            background: var(--accent);
            border-color: var(--accent);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
        }

        .input-group-text {
            border-radius: 14px 0 0 14px;
            background: #fff;
            color: var(--muted);
        }

        .input-group .form-control {
            border-radius: 0 14px 14px 0;
        }

        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--muted);
            z-index: 4;
        }

        .soft-card {
            background: var(--accent-soft);
            border: 1px solid rgba(37, 99, 235, 0.12);
            border-radius: 16px;
        }

        a {
            transition: color 0.2s ease;
        }
    </style>
</head>
<body>
    <main class="auth-shell d-flex align-items-center justify-content-center px-3 py-4">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
                button.addEventListener('click', function () {
                    const target = document.getElementById(this.getAttribute('data-password-toggle'));
                    if (!target) return;
                    const isPassword = target.type === 'password';
                    target.type = isPassword ? 'text' : 'password';
                    this.innerHTML = isPassword ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
                    this.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            });
        });
    </script>
</body>
</html>
